[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "seculens"
version = "1.1.0"
description = "Independent Python SBOM vulnerability matching, license policies, static analysis and Word reports"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/seculens/assets/OFL.txt"]
authors = [{name = "SecuLens contributors"}]
keywords = ["sbom", "security", "spdx", "cyclonedx", "vulnerability", "static-analysis", "docx"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "packaging>=24,<27",
  "semantic-version>=2.10,<3",
  "packageurl-python>=0.17,<1",
  "license-expression>=30.4,<31",
  "python-docx>=1.2,<2",
  "requests>=2.34.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2", "twine>=6,<8", "pip-audit>=2.9,<3"]

[project.scripts]
seculens = "seculens.cli:main"

[project.urls]
Homepage = "https://github.com/masahiroid/seculens-python"
Repository = "https://github.com/masahiroid/seculens-python"
Issues = "https://github.com/masahiroid/seculens-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/seculens"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "pyproject.toml", "README.md", "LICENSE", "NOTICE", "SECURITY.md", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
